  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: rgba(22, 25, 33, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --row-bg: rgba(255, 255, 255, 0.04);
      --row-hover: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --btn-bg: #2a2e39;
      --btn-hover: #3b4150;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px 50px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient blurred background */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #1e2638 0%, #0c0e12 85%);
      z-index: -2;
    }

    .bg-blur-art {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: url('cover.jpg') center/cover no-repeat;
      filter: blur(60px) brightness(0.25);
      z-index: -1;
      opacity: 0.6;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    /* Artwork image */
    .artwork-container {
      width: 100%;
      position: relative;
      margin-bottom: 18px;
    }

    .artwork {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: block;
      background: #1b1e24;
    }

    .title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 20px;
    }

    /* Platform links list */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--row-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .link-item:hover {
      background: var(--row-hover);
      transform: translateY(-1px);
    }

    .platform-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .platform-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .platform-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .platform-name {
      font-size: 0.96rem;
      font-weight: 600;
      text-align: left;
    }

    .btn-action {
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 8px;
      min-width: 72px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s ease;
    }

    .link-item:hover .btn-action {
      background: var(--btn-hover);
    }

    /* Specific brand colors */
    .c-spotify { color: #1db954; }
    .c-ytmusic { color: #ff0000; }
    .c-apple { color: #fa243c; }
    .c-amazon { color: #00a8e1; }
    .c-deezer { color: #a238ff; }
    .c-tiktok { color: #25f4ee; }
    .c-tidal { color: #ffffff; }
    .c-boomplay { color: #1585ff; }
    .c-audiomack { color: #ffa200; }
    .c-printify { color: #29ab51; }
    .c-youtube { color: #ff0000; }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--text-main);
    }

    .footer-links {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
